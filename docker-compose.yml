services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/bot_telegram
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposto só localmente; o Caddy publica com HTTPS.
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: bot_telegram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem porta publicada: só o app acessa. Para usar um cliente SQL local,
    # descomente a linha abaixo.
    # ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_telegram"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional: HTTPS automático (Let's Encrypt). Necessário apenas para o webhook
  # do Mercado Pago e para acessar o painel de fora. Edite o domínio no Caddyfile.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
