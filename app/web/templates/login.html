{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="login-brand">
  <svg width="48" height="48" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M6 14s3-5.500 8-5.500S22 14 22 14s-3 5.500-8 5.500S6 14 6 14Z" fill="none" stroke="var(--on-accent)" stroke-width="1.8"/><circle cx="14" cy="14" r="2.400" fill="var(--on-accent)"/></svg>
  <h1>Watchgram</h1>
  <p>Entre para cuidar do seu bot e dos seus membros.</p>
</div>
<div class="card login">
  <form method="post" action="/login" class="stack">
    <label>Usuário <input name="username" autocomplete="username" required autofocus></label>
    <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary">Entrar</button>
  </form>
</div>
{% endblock %}
